<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valentine Proposal ❤️</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Great+Vibes&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #8b0000;
      font-family: 'Playfair Display', serif;
      overflow: hidden;
    }

    .frame {
      background: #e5e5e5;
      width: 85%;
      max-width: 1000px;
      padding: 40px;
      border-radius: 25px;
      box-shadow: 0 0 40px rgba(0,0,0,0.3);
      text-align: center;
      position: relative;
    }

    .title {
      margin-bottom: 30px;
    }

    .title h2 {
      font-family: 'Great Vibes', cursive;
      font-size: 50px;
      color: #7a0c0c;
      margin: 0;
    }

    .title p {
      margin-top: 5px;
      font-size: 18px;
      color: #7a0c0c;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
      margin-top: 30px;
      margin-bottom: 40px;
    }

    .photo {
      border: 3px solid #7a0c0c;
      padding: 5px;
      background: white;
      transition: 0.4s;
    }

    .photo img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      display: block;
    }

    .photo:hover {
      transform: scale(1.05);
    }

    .question {
      font-size: 38px;
      color: #7a0c0c;
      margin-bottom: 30px;
      font-family: 'Dancing Script', cursive;
    }

    .buttons {
      position: relative;
      height: 120px;
    }

    button {
      font-size: 20px;
      padding: 12px 28px;
      border-radius: 30px;
      border: none;
      cursor: pointer;
      position: absolute;
      transition: 0.3s;
    }

    #yesBtn {
      background: #7a0c0c;
      color: white;
      left: 35%;
    }

    #yesBtn:hover {
      transform: scale(1.1);
    }

    #noBtn {
      background: white;
      color: #7a0c0c;
      border: 2px solid #7a0c0c;
      left: 55%;
    }

    .success {
      font-family: 'Great Vibes', cursive;
      font-size: 45px;
      color: #7a0c0c;
    }

  
    @keyframes pour {
      0% {
        transform: translateY(0);
        opacity: 1;
      }
      100% {
        transform: translateY(110vh);
        opacity: 0.9;
      }
    }

  

    @keyframes pour {
      0% {
        transform: translateY(0);
        opacity: 1;
      }
      100% {
        transform: translateY(110vh);
        opacity: 0.9;
      }
    }

  </style>
</head>
<body>

  <div class="frame" id="mainBox">

    <div class="title">
      <h2>You too fine</h2>
      <p>so be MINE</p>
    </div>

    <!-- Replace images below with your pictures -->
    <div class="gallery">
      <div class="photo">
        <img src="photo1.jpg" />
      </div>

      <div class="photo">
        <img src="photo2.jpg" />
      </div>

      <div class="photo">
        <img src="photo3.jpg" />
      </div>
    </div>

    <div class="question">This Valentine?</div>

    <div class="buttons">
      <button id="yesBtn">YES ❤️</button>
      <button id="noBtn">NO 😤</button>
    </div>

  </div>

  <script>

    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const mainBox = document.getElementById("mainBox");

    noBtn.addEventListener("mouseenter", () => {
      const maxX = window.innerWidth - noBtn.offsetWidth;
      const maxY = window.innerHeight - noBtn.offsetHeight;

      const randomX = Math.random() * maxX;
      const randomY = Math.random() * maxY;

      noBtn.style.position = "fixed";
      noBtn.style.left = randomX + "px";
      noBtn.style.top = randomY + "px";
    });

    yesBtn.addEventListener("click", () => {
      mainBox.innerHTML = "<div class='success'>Yayyyy ❤️</div>";
      startHearts();
    });

    function startHearts() {
      setInterval(() => {
        // create multiple hearts each interval for pouring effect
        for (let i = 0; i < 6; i++) {
          const heart = document.createElement("div");
          heart.innerHTML = "❤️";
          heart.style.position = "fixed";
          heart.style.top = "-40px";
          heart.style.left = Math.random() * window.innerWidth + "px";
          heart.style.fontSize = Math.random() * 25 + 20 + "px";
          heart.style.pointerEvents = "none";
          heart.style.animation = `pour ${Math.random() * 2 + 3}s linear forwards`;

          document.body.appendChild(heart);

          setTimeout(() => heart.remove(), 5000);
        }
      }, 150);
    }

  </script>

</body>
</html>
